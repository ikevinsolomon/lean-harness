<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lean Harness</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <script type="module" src="/lean-chat.js"></script>
    <style>
      html, body { margin: 0; height: 100%; background: #fbfbf9; }
    </style>
  </head>
  <body>
    <lean-chat
      mode="page"
      theme="light"
      heading="Lean Harness"
      icon="/logo.svg"
      greeting="How can I help?"
      suggestions="What can you do?: Tools, memory and models | How do I add a tool?: From the built-in guide | What time is it in Tokyo?: Uses the clock tool | Remember I like short answers: Saved to long-term memory"
    ></lean-chat>
  </body>
</html>
